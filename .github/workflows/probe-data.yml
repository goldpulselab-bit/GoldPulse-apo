name: Probe free historical data endpoints
on:
  push:
    branches:
      - strategy-engine-prototype
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public catalogue for data routes
        shell: bash
        run: |
          curl -L -sS --max-time 20 https://evtradelabs.com/data -o /tmp/catalog.html
          echo "SCRIPT URLS"
          grep -oE 'src="[^"]+\.js[^"]*"' /tmp/catalog.html | head -20
          echo "API/DOWNLOAD REFERENCES"
          grep -oE '.{0,100}(/api/|\.json\.gz|download|catalog).{0,140}' /tmp/catalog.html | head -30
          echo "CHECK POSSIBLE PUBLIC ROUTES"
          for path in "/api/data" "/api/catalog" "/api/files" "/data/catalog.json" "/data/catalog" "/api/download"; do
            code=$(curl -L -sS --max-time 10 -o /dev/null -w "%{http_code}" "https://evtradelabs.com$path")
            echo "$path HTTP=$code"
          done
