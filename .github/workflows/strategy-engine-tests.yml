name: Strategy engine primitive tests
on:
  push:
    branches:
      - strategy-engine-prototype
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/strategy-engine.test.js
      - run: node tests/setup-detectors.test.js
      - run: node tests/swing-resolver.test.js
      - run: node tests/backtest-blue-zones.test.js
