name: Focused Gold indicator strategy research
on:
  push:
    branches:
      - strategy-engine-prototype
  workflow_dispatch:
jobs:
  research-gold:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download five years of Gold H1 history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/XAUUSD/H1
          for year in 2021 2022 2023 2024 2025; do
            url="https://evtradelabs.com/api/simulator/data/XAUUSD/H1/$year.json.gz"
            curl -fLsS --retry 2 --max-time 60 "$url" -o "/tmp/XAUUSD-$year.json.gz"
            gzip -dc "/tmp/XAUUSD-$year.json.gz" > "data/XAUUSD/H1/$year.json"
            test -s "data/XAUUSD/H1/$year.json"
          done
      - name: Run indicator strategy parameter grid and frozen out-of-sample test
        run: node scripts/research-ema-rsi-strategy.js data strategy-results
      - name: Upload strategy report
        uses: actions/upload-artifact@v4
        with:
          name: gold-indicator-strategy-research-2021-2025
          path: strategy-results/
          if-no-files-found: error
